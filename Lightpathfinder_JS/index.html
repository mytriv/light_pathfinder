<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Light Pathfinder — JavaScript engine slice</title>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <main class="shell">
    <header><strong>LIGHT PATHFINDER</strong><span id="map-name">Loading original XP map…</span></header>

  <script type="module" src="src/main.js"></script>

</html>
